title: Gemini Enterprise Agent Platform과 Agent Gateway(IAP·Model Armor)를 활용한 에이전트
  워크로드 거버넌스
description: 에이펙스 금융그룹(Apex Financial Group) 주택담보대출 심사 시나리오를 바탕으로, Agent Gateway의
  클라이언트 사이드(agent-egress) 및 서버 사이드(cloud-run) 배포 토폴로지, IAP(CEL 기반 컨텍스트 인식 접근 제어),
  Model Armor + Cloud DLP(한국 주민등록번호 KOREA_RRN 및 미국 SSN 자동 마스킹), 그리고 DRY_RUN/ENFORCED
  정책 라이프사이클과 통합 관측성(Observability)을 실습합니다.
